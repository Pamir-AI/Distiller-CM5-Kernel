%YAML 1.2
---
$id: http://devicetree.org/schemas/input/pamir-ai,key-input.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Pamir AI Key Input Driver

maintainers:
  - Utsav Balar <utsavbalar1231@gmail.com>

description: |
  The Pamir AI Key Input driver interfaces with a microcontroller (typically an RP2040)
  over UART. It processes button state information from the microcontroller and exposes
  the buttons as input events to the Linux input subsystem. It also provides a bidirectional
  UART communication interface accessible from userspace via a character device.
  
  The driver supports both a line-based protocol (where each line contains a decimal
  number representing button state) and a raw protocol (where each byte directly represents
  button state).

properties:
  compatible:
    const: pamir-ai,key-input

  debounce-interval-ms:
    description:
      Debounce interval in milliseconds to prevent multiple button
      events from being triggered due to physical button bounce.
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 50

  raw-protocol:
    description:
      Use raw protocol instead of line-based protocol. In raw protocol mode,
      each byte directly represents a button state (values 0-15 valid).
    type: boolean

  report-press-only:
    description:
      Only report button press events, not release events. When a button is
      released, the driver will immediately send a release event to ensure
      the key doesn't "stick".
    type: boolean

  recovery-timeout-ms:
    description:
      Timeout in milliseconds for UART recovery in case of communication errors.
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 1000

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/input/input.h>
    
    pamir_key_input: pamir-key-input {
        compatible = "pamir-ai,key-input";
        status = "okay";
        
        /* Optional configurations */
        debounce-interval-ms = <50>;
        raw-protocol;
        report-press-only;
        recovery-timeout-ms = <1000>;
    };
... 