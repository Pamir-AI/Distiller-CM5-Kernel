%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/pamir-ai,sam.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Pamir AI Ultra-Optimized UART Protocol Device

maintainers:
  - Pamir AI Team

description: |
  The Pamir AI SAM is an binary communication protocol for communication
  between a Linux host processor and an RP2040 microcontroller. It provides a 
  compact, reliable interface for buttons, LEDs, power management, and system 
  commands.

  The protocol uses a fixed-size 4-byte packet format with checksum validation
  to ensure reliable communication.

properties:
  compatible:
    const: pamir-ai,sam

  debug-level:
    description: |
      Controls verbosity of debug messages:
      0 = Minimal debugging (errors only)
      1 = Basic debugging (errors + important events)
      2 = Verbose debugging (all debug messages)
      3 = Ultra-verbose debugging (all debug messages + protocol details)
    type: integer
    minimum: 0
    maximum: 3
    default: 1

  ack-required:
    description: |
      If true, the driver will send an acknowledgment packet for each
      received packet (except button events). This improves reliability
      at the cost of increased traffic.
    type: boolean
    default: false

  recovery-timeout-ms:
    description: |
      Timeout in milliseconds for protocol recovery in case of communication
      errors. After this period without valid communication, the driver will
      attempt to reset the communication channel.
    type: integer
    minimum: 100
    maximum: 10000
    default: 1000

required:
  - compatible

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    serial@12340000 {
      compatible = "ns16550a";
      reg = <0x12340000 0x100>;
      interrupts = <GIC_SPI 68 IRQ_TYPE_LEVEL_HIGH>;
      clock-frequency = <5000000>;
      current-speed = <115200>;

      pamir_ai_sam: pamir-ai-sam {
        compatible = "pamir-ai,sam";
        debug-level = <1>;
        ack-required = <0>;
        recovery-timeout-ms = <1000>;
      };
    };

  - |
    # Example for Raspberry Pi CM5 with RP1 SoC

    serial@41000000 {
      compatible = "arm,pl011", "arm,primecell";
      reg = <0x41000000 0x1000>;
      interrupts = <GIC_SPI 16 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&rp1_clk RP1_CLK_UART>, <&rp1_clk RP1_CLK_PERI_SYS>;
      clock-names = "uartclk", "apb_pclk";
      current-speed = <115200>;
      status = "okay";

      pamir_ai_sam: pamir-ai-sam {
        compatible = "pamir-ai,sam";
        debug-level = <2>;
        ack-required = <1>;
        recovery-timeout-ms = <1500>;
      };
    };

  - |
    # Example for Raspberry Pi CM5 using BCM2835 auxiliary UART

    auxuart@41000000 {
      compatible = "brcm,bcm2835-aux-uart";
      reg = <0x41000000 0x40>;
      interrupts = <GIC_SPI 29 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clocks BCM2835_CLOCK_UART>;
      status = "okay";
      
      pamir_ai_sam: pamir-ai-sam {
        compatible = "pamir-ai,sam";
        debug-level = <1>;
        ack-required = <0>;
        recovery-timeout-ms = <1000>;
      };
    };
